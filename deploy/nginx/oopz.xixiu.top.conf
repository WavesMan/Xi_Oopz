# =========================================
# Nginx 配置：oopz.xixiu.top
# =========================================
# 功能：
#  - oopz.xixiu.top        → Oopz Live 前端静态文件
#  - oopz.xixiu.top/api    → Gin API（18080）
#  - oopz.xixiu.top/ws     → Gin WebSocket（18080）
# =========================================

server {
    listen 80;
    server_name oopz.xixiu.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name oopz.xixiu.top;

    ssl_certificate /etc/letsencrypt/live/oopz.xixiu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oopz.xixiu.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/oopz.xixiu.top/chain.pem;

    access_log /var/log/nginx/oopz.xixiu.top_access.log;
    error_log /var/log/nginx/oopz.xixiu.top_error.log;

    root /home/oopz/oopz-live/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /ws {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /favicon.svg {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), display-capture=(self), camera=(self), geolocation=()" always;

}
